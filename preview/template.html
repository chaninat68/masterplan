<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master Planning Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme: light;
  --page:#eef3fb; --surface:#ffffff; --surface-2:#f5f8fd; --surface-3:#eaf1fc;
  --ink:#0f1b33; --ink-2:#4d5b74; --muted:#8a96ab; --line:#e3e9f3; --line-2:#d3dcea;
  --accent:#1f6fe5; --accent-ink:#ffffff; --accent-soft:#e7f0ff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --plan:#898781;
  --good:#0ca30c; --good-ink:#0a7a0a; --good-soft:#e5f6e5;
  --warn:#fab219; --warn-ink:#9a6a00; --warn-soft:#fff4dc;
  --bad:#d03b3b; --bad-ink:#c02f2f; --bad-soft:#fde8e8;
  --i-blue:#e6efff; --i-green:#e3f6ec; --i-amber:#fff1d6; --i-red:#fde6e6;
  --shadow:0 1px 2px rgba(15,27,51,.04),0 6px 24px rgba(15,27,51,.06);
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0c111c; --surface:#151c2b; --surface-2:#1a2335; --surface-3:#1f2a40;
    --ink:#eef2f8; --ink-2:#b4bfd2; --muted:#8a96ab; --line:#263047; --line-2:#33405c;
    --accent:#4c8dff; --accent-ink:#06122a; --accent-soft:#1c2c4d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --plan:#9a988f;
    --good-ink:#3fcf3f; --good-soft:#15301c; --warn-ink:#fab219; --warn-soft:#33290f; --bad-ink:#f07575; --bad-soft:#3a1a1d;
    --i-blue:#1c2c4d; --i-green:#15301f; --i-amber:#33290f; --i-red:#3a1a1d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
    color-scheme: dark;
    --page:#0c111c; --surface:#151c2b; --surface-2:#1a2335; --surface-3:#1f2a40;
    --ink:#eef2f8; --ink-2:#b4bfd2; --muted:#8a96ab; --line:#263047; --line-2:#33405c;
    --accent:#4c8dff; --accent-ink:#06122a; --accent-soft:#1c2c4d;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --plan:#9a988f;
    --good-ink:#3fcf3f; --good-soft:#15301c; --warn-ink:#fab219; --warn-soft:#33290f; --bad-ink:#f07575; --bad-soft:#3a1a1d;
    --i-blue:#1c2c4d; --i-green:#15301f; --i-amber:#33290f; --i-red:#3a1a1d;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;max-width:1560px;margin:0 auto}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;padding:4px 10px 18px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink-2);cursor:pointer;font-weight:500;position:relative}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button.on::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav svg{width:19px;height:19px;flex:none}
.nav .count{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.side-card{margin-top:auto;background:linear-gradient(160deg,var(--accent-soft),var(--surface-3));border-radius:14px;padding:16px;font-size:13px;color:var(--ink-2)}
.side-card b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.side-card .btn{margin-top:10px}
/* main */
.main{padding:18px 26px 40px;min-width:0}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.icon-btn.burger{display:none}
.search{flex:1;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;color:var(--muted)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink)}
.search kbd{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px}
.icon-btn{all:unset;cursor:pointer;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);position:relative;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink)}
.icon-btn .dot{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:99px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;border:2px solid var(--page)}
.me{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 10px 5px 6px}
.avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--accent);font-size:13px}
.me .who{line-height:1.2}
.me .who b{display:block;font-size:13px}
.me select{border:0;background:transparent;font-size:12px;color:var(--muted);padding:0;cursor:pointer;outline:0}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hello h1{margin:0;font-size:26px;letter-spacing:-.01em}
.hello p{margin:2px 0 0;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.ro{background:var(--warn-soft);color:var(--warn-ink);border-color:transparent;font-weight:600}
/* grid & cards */
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g64{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g46{grid-template-columns:minmax(0,1fr) minmax(0,1.45fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:600}
.card .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.mb{margin-bottom:18px}
.kpi{display:flex;gap:14px;align-items:flex-start}
.kpi .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:22px;height:22px}
.kpi .lbl{color:var(--ink-2);font-size:13px}
.kpi .val{font-size:26px;font-weight:700;line-height:1.2;margin:2px 0}
.kpi .val small{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .cmp{font-size:12.5px;color:var(--muted)}
.up{color:var(--good-ink);font-weight:600}.down{color:var(--bad-ink);font-weight:600}
.ic.blue{background:var(--i-blue);color:var(--s1)}.ic.green{background:var(--i-green);color:var(--good-ink)}.ic.amber{background:var(--i-amber);color:var(--warn-ink)}.ic.red{background:var(--i-red);color:var(--bad-ink)}
.kpi-card.red{background:linear-gradient(180deg,var(--bad-soft),var(--surface) 70%)}
.kpi-card.amber{background:linear-gradient(180deg,var(--warn-soft),var(--surface) 70%)}
.kpi-card.green{background:linear-gradient(180deg,var(--good-soft),var(--surface) 70%)}
/* buttons */
.btn{all:unset;display:inline-flex;align-items:center;gap:7px;cursor:pointer;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;background:var(--accent);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn svg{width:16px;height:16px}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:13px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:8px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg button .n{color:var(--muted);font-weight:500;margin-left:4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .grow{flex:1}
.input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;outline:0;min-width:0}
.input:focus{border-color:var(--accent)}
/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)}.ink2{color:var(--ink-2)}
.nowrap{white-space:nowrap}
.code{font-weight:600;white-space:nowrap}
.cell-sub{font-size:12px;color:var(--muted);display:block;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.prow{cursor:pointer}
tr.prow:hover td{background:var(--surface-2)}
tr.prow.open td{background:var(--accent-soft);border-bottom-color:transparent}
.caret{display:inline-block;transition:transform .15s;color:var(--muted);width:14px}
tr.open .caret{transform:rotate(90deg);color:var(--accent)}
tr.detail>td{background:var(--surface-2);padding:0 0 4px}
.detail-in{padding:16px 18px 18px;border-left:3px solid var(--accent)}
/* progress */
.prog{display:flex;align-items:center;gap:10px;min-width:150px}
.bar{position:relative;flex:1;height:8px;border-radius:99px;background:var(--surface-3);overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--s1)}
.bar>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:2px;opacity:.55}
.prog span{font-size:12.5px;color:var(--ink-2);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
/* delta chip */
.dc{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:2px 8px;font-size:12.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.dc.g{background:var(--good-soft);color:var(--good-ink)}.dc.r{background:var(--bad-soft);color:var(--bad-ink)}.dc.n{background:var(--surface-3);color:var(--ink-2)}.dc.a{background:var(--warn-soft);color:var(--warn-ink)}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-ongoing{background:var(--i-blue);color:var(--s1)}.st-on_hand{background:var(--i-amber);color:var(--warn-ink)}.st-hold{background:var(--surface-3);color:var(--ink-2)}.st-completed{background:var(--i-green);color:var(--good-ink)}.st-cancelled{background:var(--i-red);color:var(--bad-ink)}
.pill{display:inline-block;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px;white-space:nowrap}
.pill b{font-weight:600}
/* editable */
.ed{cursor:text;border-radius:6px;padding:2px 6px;margin:-2px -6px;outline:1px dashed transparent}
.can-edit .ed:hover{outline-color:var(--accent);background:var(--accent-soft)}
.ed input,.ed select{width:100%;min-width:70px;border:1px solid var(--accent);border-radius:6px;padding:3px 6px;background:var(--surface);outline:0}
.ed.edited{box-shadow:inset 0 -2px 0 var(--s4)}
.note-add{color:var(--muted);font-size:12px}
.can-edit .note-add:hover{color:var(--accent)}
.quick{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.quick button{all:unset;cursor:pointer;font-size:11.5px;border:1px solid var(--line);border-radius:99px;padding:1px 9px;background:var(--surface)}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
tr.noday td{background:var(--warn-soft)}
tr.missing td{background:var(--bad-soft)}
tr.future td{color:var(--ink-2)}
tr.today td{box-shadow:inset 0 2px 0 var(--accent)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px;margin-bottom:16px}
.fields div{font-size:13px}
.fields label{display:block;color:var(--muted);font-size:12px}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.mini div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini label{display:block;color:var(--muted);font-size:12px}
.mini b{font-size:18px;font-variant-numeric:tabular-nums}
/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.li .ic svg{width:18px;height:18px}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t span{font-size:12px;color:var(--muted)}
/* flow */
.flow{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:6px 0}
.flow .step{text-align:center;flex:1;min-width:0}
.flow .step .ic{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center}
.flow .step .ic svg{width:24px;height:24px}
.flow .step b{display:block;font-size:22px}
.flow .step span{font-size:12.5px;color:var(--ink-2)}
.flow .step small{display:block;color:var(--muted);font-size:11.5px}
.flow .arr{color:var(--muted);flex:none}
/* legend */
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.legend i.line{height:2px;width:16px;border-radius:2px}
.legend i.dash{height:0;width:16px;border-top:2px dashed var(--plan);border-radius:0}
.donut-wrap{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.donut-box{position:relative;height:170px}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-c b{font-size:24px;display:block;line-height:1.1}
.donut-c span{font-size:12px;color:var(--muted)}
.dl{display:flex;flex-direction:column;gap:9px}
.dl div{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;font-size:13px}
.dl i{width:10px;height:10px;border-radius:50%}
.dl b{font-variant-numeric:tabular-nums}
.dl .p{color:var(--muted);font-size:12px;min-width:44px;text-align:right}
.chart-box{position:relative;height:260px}
.chart-box.sm{height:200px}
/* dropzone */
.drop{border:2px dashed var(--line-2);border-radius:16px;padding:34px 20px;text-align:center;background:var(--surface-2);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:40px;height:40px;color:var(--accent)}
.drop b{display:block;font-size:16px;margin:8px 0 4px}
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.sumrow div{border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.sumrow b{display:block;font-size:22px}
.tag-new{color:var(--good-ink)}.tag-dup{color:var(--muted)}.tag-err{color:var(--bad-ink)}.tag-warn{color:var(--warn-ink)}
/* runway gauge */
.runway{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.runway .big{font-size:52px;font-weight:700;line-height:1}
.runway .big small{font-size:18px;font-weight:500;color:var(--muted)}
.statusline{display:inline-flex;align-items:center;gap:8px;border-radius:10px;padding:6px 12px;font-weight:600}
.statusline.r{background:var(--bad-soft);color:var(--bad-ink)}.statusline.a{background:var(--warn-soft);color:var(--warn-ink)}.statusline.g{background:var(--good-soft);color:var(--good-ink)}
.heat td.h{text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;padding:8px 4px;min-width:42px}
.heat th.h{text-align:center;padding:8px 4px;font-size:11.5px}
.wk{color:var(--bad-ink)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:12px;font-weight:500;opacity:0;transition:.2s;z-index:50;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-bg{position:fixed;inset:0;background:rgba(10,16,30,.45);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal-bg.show{display:flex}
.modal{background:var(--surface);border-radius:16px;padding:20px;max-width:560px;width:100%;box-shadow:var(--shadow)}
.modal textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface-2);resize:vertical}
.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink-2);margin-bottom:18px;display:flex;gap:10px;align-items:flex-start}
.banner b{color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:26px}
.scrim{display:none}
@media (max-width:1200px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g64,.g46,.g3{grid-template-columns:1fr}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:30;transform:translateX(-105%);transition:.2s}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .icon-btn.burger{display:grid}
  .main{padding:14px 16px 40px}
  .me .who{display:none}
  .search kbd{display:none}
}
@media (max-width:640px){
  .g4,.g2{grid-template-columns:1fr}
  .donut-wrap{grid-template-columns:1fr}
  .hello h1{font-size:21px}
  .sumrow{grid-template-columns:repeat(2,1fr)}
  .top{flex-wrap:wrap}.search{order:3;max-width:none;flex-basis:100%}
  .flow{flex-wrap:wrap}.flow .arr{display:none}.flow .step{flex-basis:30%}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">

<script>
"use strict";
/* ============================== DATA ============================== */
const RAW = JSON.parse(document.getElementById('data').textContent);
const DICT = RAW.dict;
const PILE_ASOF = '2026-10-17';          // วันที่ของไฟล์ Master Planning Update 17-10-69
const STATUS = {'1-Ongoing':'ongoing','2-On Hand':'on_hand','3-Hold':'hold','5-Completed':'completed','6-ยกเลิก':'cancelled'};
const ST_LABEL = {ongoing:'กำลังตอก',on_hand:'รอเริ่ม',hold:'พักงาน',completed:'เสร็จแล้ว',cancelled:'ยกเลิก'};
const JOB2ST = {'จบงาน':'completed','กำลังดำเนินการ':'ongoing','รอดำเนินการ':'on_hand','มีปัญหา':'hold'};

const store = (()=>{ const def={edits:{plan:{},act:{}},notes:{},N:4,proj:{}}; try{ const s=JSON.parse(localStorage.getItem('mp-preview-v1')); return s? Object.assign(def,s):def; }catch(e){ return def; } })();
function save(){ try{ localStorage.setItem('mp-preview-v1', JSON.stringify(store)); }catch(e){} }

let LOGS = RAW.logs.map(a=>({d:a[0],p:a[1],owner:DICT[a[2]],agency:DICT[a[3]],province:DICT[a[4]],ptype:DICT[a[5]],jst:DICT[a[6]],leader:DICT[a[7]],company:DICT[a[8]],rig:DICT[a[9]],rigtype:DICT[a[10]],order:a[11],std:DICT[a[12]],size:DICT[a[13]],section:a[14],len:a[15],shift:(a[16]||'').trim(),qty:a[17],cubic:a[18],m:a[19],src:'seed'}));
const SALES = RAW.sales.map(a=>({t:a[0],d:a[1],p:a[2],pname:DICT[a[3]],cust:DICT[a[4]],group:normGroup(DICT[a[5]]),amt:a[6],appr:DICT[a[7]],isNew:DICT[a[8]]==='ลูกค้าใหม่',sales:DICT[a[9]]||'ไม่ระบุ',svc:DICT[a[10]],qty:a[11],gp:DICT[a[12]]}));
function normGroup(g){ const m={'Contractor':'ผู้รับเหมา','Sub Contractor':'ผู้รับเหมา','ผู้รับเหมา':'ผู้รับเหมา','Owner':'เจ้าของงาน','เจ้าของงาน':'เจ้าของงาน','Materials Shop':'ร้านวัสดุ','ร้านวัสดุ':'ร้านวัสดุ','Developer':'Developer','บริษัท/หน่วยงาน':'บริษัท/หน่วยงาน'}; return m[g]||'ไม่ระบุ'; }

const P = {};
for(const r of RAW.projects){
  P[r.code] = {code:r.code,pm:r.pm||'',sales:r.sales||'',status:STATUS[r.status]||'completed',customer:r.customer||'',name:r.name||'',order:r.order||0,value:r.value||0,vpp:r.vpp||0,start:r.start||'',end:r.end||'',billing:r.billing||'',endNote:r.endNote||'',plan:r.plan||{},act:r.act||{},notes:r.notes||{},fromPile:true,excelAB:r.ab};
}
let ASOF, LQ, LBYP, LBYD, DATES, memo={};
function ensureProjectsFromLogs(){
  for(const l of LOGS){
    if(P[l.p]) continue;
    P[l.p]={code:l.p,pm:'',sales:'',status:JOB2ST[l.jst]||'ongoing',customer:l.owner,name:l.agency,order:0,value:0,vpp:0,start:'',end:'',billing:'',plan:{},act:{},notes:{},fromPile:false};
  }
  for(const c in P){ const p=P[c]; if(!p.fromPile){ const so={}; for(const l of (LBYP[c]||[])) so[l.size+'|'+l.len]=Math.max(so[l.size+'|'+l.len]||0,l.order); p.order=Object.values(so).reduce((a,b)=>a+b,0); } }
}
function reindex(){
  LQ={}; LBYP={}; LBYD={};
  for(const l of LOGS){ (LQ[l.p]||(LQ[l.p]={}))[l.d]=((LQ[l.p][l.d])||0)+l.qty; (LBYP[l.p]||(LBYP[l.p]=[])).push(l); (LBYD[l.d]||(LBYD[l.d]=[])).push(l); }
  DATES = Object.keys(LBYD).filter(d=>LBYD[d].some(l=>l.qty>0)).sort(); ASOF = DATES[DATES.length-1];
  ensureProjectsFromLogs();
  for(const c in store.proj){ if(P[c]) Object.assign(P[c], store.proj[c]); }
  memo={};
}
reindex();

/* ============================== HELPERS ============================== */
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'];
const fD = s => { if(!s) return '–'; const [y,m,d]=s.split('-').map(Number); return `${d} ${TH_M[m-1]} ${String(y+543).slice(2)}`; };
const fDs = s => { const [y,m,d]=s.split('-').map(Number); return `${d} ${TH_M[m-1]}`; };
const fM = ym => { const [y,m]=ym.split('-').map(Number); return `${TH_M[m-1]} ${String(y+543).slice(2)}`; };
const addD=(s,n)=>{const d=new Date(s+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10)};
const dow = s => new Date(s+'T00:00:00Z').getUTCDay();
const diffD=(a,b)=>Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/864e5);
const fN=(n,dp=0)=> (n==null||isNaN(n))?'–':Number(n).toLocaleString('th-TH',{maximumFractionDigits:dp});
const fB=n=>{ if(n==null||isNaN(n)) return '–'; const a=Math.abs(n); const s=n<0?'−':''; return a>=1e6? `${s}฿${(a/1e6).toLocaleString('th-TH',{maximumFractionDigits:2})} ล้าน` : `${s}฿${fN(a)}`; };
const fB2=n=>'฿'+Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const sum=(a,f=x=>x)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const range=(a,b)=>{const out=[];for(let d=a;d<=b;d=addD(d,1))out.push(d);return out};
const companyCat=c=> c==='ASIA'?'เอเซีย': c==='ASIA-ร่วม'?'เอเซียร่วม':'ผู้รับเหมาร่วม';
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }

function actualMap(code){
  const p=P[code], m={};
  if(p.fromPile){ for(const d in p.act) if(d<=PILE_ASOF) m[d]=p.act[d]; const lq=LQ[code]||{}; for(const d in lq) if(d>PILE_ASOF) m[d]=lq[d]; }
  else Object.assign(m, LQ[code]||{});
  Object.assign(m, store.edits.act[code]||{});
  for(const d in m) if(!m[d]) delete m[d];
  return m;
}
function planMap(code){ const m=Object.assign({}, P[code].plan, store.edits.plan[code]||{}); for(const d in m) if(!m[d]) delete m[d]; return m; }
function noteOf(code,d){ const k=code+'|'+d; if(k in store.notes) return store.notes[k]; const v=P[code]?.notes?.[d]; return v==null?'':(v==='x'?'ไม่มีการตอก (x)':v); }
function coNote(d){ return store.notes['*|'+d]||''; }
function prog(code){
  if(memo[code]) return memo[code];
  const p=P[code], a=actualMap(code), pl=planMap(code);
  let done=0, planTo=0, planTotal=0, last14=0; const from14=addD(ASOF,-13);
  for(const d in a){ done+=a[d]; if(d>=from14&&d<=ASOF) last14+=a[d]; }
  for(const d in pl){ planTotal+=pl[d]; if(d<=ASOF) planTo+=pl[d]; }
  const order=p.order||planTotal, remain=Math.max(0,order-done), rate=last14/14;
  const eta = remain<=0? null : rate>0? addD(ASOF,Math.ceil(remain/rate)) : null;
  const hasPlan = planTotal>0;
  return memo[code]={done,planTo,planTotal,ab:done-planTo,remain,rate,eta,order,hasPlan,pct:order?Math.min(1,done/order):0,planPct:order?Math.min(1,planTo/order):0,valueDone:done*(p.vpp||0)};
}
function dChip(code){ const g=prog(code); if(!g.hasPlan) return '<span class="dc n">ไม่มีแผน</span>'; const v=g.ab; if(v>=0.5) return `<span class="dc g">▲ เร็ว +${fN(v,1)}</span>`; if(v<=-0.5) return `<span class="dc r">▼ ช้า ${fN(v,1)}</span>`; return '<span class="dc n">● ตามแผน</span>'; }
function progBar(code){ const g=prog(code); return `<div class="prog"><div class="bar"><i style="width:${(g.pct*100).toFixed(1)}%"></i>${g.hasPlan?`<b style="left:calc(${(g.planPct*100).toFixed(1)}% - 1px)" title="ตำแหน่งแผน ${Math.round(g.planPct*100)}%"></b>`:''}</div><span>${Math.round(g.pct*100)}%</span></div>`; }
const stBadge=s=>`<span class="badge st-${s}">${ST_LABEL[s]}</span>`;
const byStatus=s=>Object.values(P).filter(p=>p.status===s);
function weeklyRate(){ const from=addD(ASOF,-27); return sum(LOGS.filter(l=>l.d>=from&&l.d<=ASOF),l=>l.qty)/4; }
function backlog(){ const rows=Object.values(P).filter(p=>p.status==='ongoing'||p.status==='on_hand'); const t=sum(rows,p=>prog(p.code).remain), b=sum(rows,p=>prog(p.code).remain*(p.vpp||0)); const hold=byStatus('hold'); return {piles:t,baht:b,holdPiles:sum(hold,p=>prog(p.code).remain),holdBaht:sum(hold,p=>prog(p.code).remain*(p.vpp||0)),onhand:sum(byStatus('on_hand'),p=>prog(p.code).remain),ongoing:sum(byStatus('ongoing'),p=>prog(p.code).remain)}; }
function runway(){ const r=weeklyRate(), b=backlog(), w=r>0? b.piles/r : Infinity, N=+store.N||4; const lvl = w<N?'r': w<N+4?'a':'g'; return {rate:r,b,w,N,lvl,end:isFinite(w)?addD(ASOF,Math.round(w*7)):null,warnAt:isFinite(w)?addD(ASOF,Math.round((w-N)*7)):null}; }

/* ============================== ROLES & NAV ============================== */
const IC={
 home:'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
 plan:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M7 13h4M7 17h7"/>',
 day:'<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>',
 up:'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v4h16v-4"/>',
 money:'<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M6 10v.01M18 15v.01"/>',
 trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
 fac:'<path d="M2 20V9l6 4V9l6 4V5h4l2 15z"/><path d="M2 20h20"/>',
 crane:'<path d="M6 21V3l12 4H6M10 21V7M6 11h4M6 15h4"/><path d="M18 7v6"/><circle cx="18" cy="15" r="2"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 pile:'<path d="M8 3h8v4H8zM10 7v14M14 7v14"/>',
 cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 alert:'<path d="M12 3 2 21h20z"/><path d="M12 10v5M12 18v.01"/>',
 doc:'<path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h7M9 17h5"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 truck:'<path d="M1 6h13v10H1zM14 10h5l3 3v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
 cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l3 12h11l3-8H6"/>',
 note:'<path d="M4 4h16v12l-4 4H4z"/><path d="M16 20v-4h4"/>',
 dl:'<path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/>',
 copy:'<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
 line:'<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-4-.9L3 20l1.3-4A8.4 8.4 0 1 1 21 11.5z"/>',
 users:'<circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/>'
};
const svg=(k,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${IC[k]}</svg>`;
const PAGES={overview:['ภาพรวม','home'],plan:['แผน / ผลงาน','plan'],daily:['รายงานประจำวัน','day'],import:['นำเข้าไฟล์','up'],finance:['การเงิน / วางบิล','money'],sales:['ยอดขาย & Runway','trend'],production:['ผู้ผลิต','fac'],drive:['ฝ่ายตอก','crane'],settings:['ตั้งค่า','gear']};
const ROLES={
  planning:{label:'ฝ่าย Planning',name:'ฝ่ายวางแผน',pages:['overview','plan','daily','import','finance','sales','production','drive','settings'],home:'plan',edit:true},
  manager:{label:'ผู้จัดการ',name:'ผู้จัดการ',pages:['overview','plan','daily','finance','sales','production','drive'],home:'overview',edit:false},
  accounting:{label:'ฝ่ายบัญชี',name:'ฝ่ายบัญชี',pages:['finance','plan','daily','sales'],home:'finance',edit:false},
  production:{label:'ผู้ผลิต',name:'ฝ่ายผลิต',pages:['production','plan','daily'],home:'production',edit:false},
  drive_team:{label:'ฝ่ายตอก',name:'ฝ่ายตอก',pages:['drive','daily','plan'],home:'drive',edit:false},
  admin:{label:'ผู้ดูแลระบบ',name:'แอดมิน',pages:Object.keys(PAGES),home:'overview',edit:true}
};
const S={role:'manager',page:'overview',q:'',planTab:'ongoing',expanded:new Set(),fullDays:new Set(),day:null,chartRange:30,imports:[],pending:null};
try{ const r=localStorage.getItem('mp-role'); if(r&&ROLES[r]) S.role=r; }catch(e){}
S.page=ROLES[S.role].home;
const canEdit=()=>ROLES[S.role].edit;

/* ============================== CHARTS ============================== */
let CH=[];
function mk(id,cfg){ const el=document.getElementById(id); if(!el) return; CH.push(new Chart(el,cfg)); }
function chartBase(){
  Chart.defaults.font.family='"IBM Plex Sans Thai",system-ui,sans-serif'; Chart.defaults.font.size=12;
  Chart.defaults.color=css('--muted'); Chart.defaults.borderColor=css('--line');
  Object.assign(Chart.defaults.plugins.tooltip,{backgroundColor:css('--ink'),titleColor:css('--surface'),bodyColor:css('--surface'),footerColor:css('--surface'),padding:10,cornerRadius:8,boxPadding:4,usePointStyle:true});
  Chart.defaults.plugins.legend.display=false; Chart.defaults.maintainAspectRatio=false;
}
const axisX=(extra={})=>Object.assign({grid:{display:false},border:{color:css('--line-2')},ticks:{maxRotation:0,autoSkipPadding:14}},extra);
const axisY=(extra={})=>Object.assign({grid:{color:css('--line')},border:{display:false},beginAtZero:true,ticks:{callback:v=>fN(v)}},extra);

/* ============================== SHELL ============================== */
function renderShell(){
  const R=ROLES[S.role];
  const behind=Object.values(P).filter(p=>p.status==='ongoing'&&prog(p.code).hasPlan&&prog(p.code).ab<=-0.5).length;
  document.getElementById('nav').innerHTML=R.pages.map(k=>`<button data-go="${k}" class="${S.page===k?'on':''}">${svg(PAGES[k][1])}${PAGES[k][0]}${k==='plan'&&behind?`<span class="count">${behind}</span>`:''}</button>`).join('');
  document.getElementById('meName').textContent=R.name;
  document.getElementById('av').textContent=R.name.slice(0,1);
  document.getElementById('role').innerHTML=Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${k===S.role?'selected':''}>${v.label}</option>`).join('');
  document.getElementById('bellN').textContent=behind; document.getElementById('bellN').style.display=behind?'grid':'none';
  const rw=runway();
  document.getElementById('sideCard').innerHTML=`<b>ข้อมูลล่าสุด ${fD(ASOF)}</b>ผลงานตอกนำเข้าจากไฟล์คิว-วัน · แผนจาก Master Planning ${fD(PILE_ASOF)}<div style="margin-top:8px">Runway <b style="display:inline;color:var(--${rw.lvl==='r'?'bad':rw.lvl==='a'?'warn':'good'}-ink)">${isFinite(rw.w)?fN(rw.w,1):'∞'} สัปดาห์</b></div>${canEdit()?`<button class="btn sm" data-go="import">${svg('up')}นำเข้าไฟล์วันนี้</button>`:''}`;
}
function hello(title,sub,right=''){
  const h=new Date().getHours(); const g=h<12?'สวัสดีตอนเช้า':h<17?'สวัสดีตอนบ่าย':'สวัสดีตอนเย็น';
  return `<div class="hello"><div><h1>${title||g+', '+ROLES[S.role].name}</h1><p>${sub}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${!canEdit()?'<span class="chip ro">ดูอย่างเดียว</span>':''}${right}<span class="chip">${svg('cal','width="16" height="16"')}ข้อมูลถึง ${fD(ASOF)}</span></div></div>`;
}
function render(keepScroll){
  const y=window.scrollY; CH.forEach(c=>c.destroy()); CH=[]; chartBase();
  if(!ROLES[S.role].pages.includes(S.page)) S.page=ROLES[S.role].home;
  renderShell();
  const pg=document.getElementById('page'); pg.className=canEdit()?'can-edit':'';
  pg.innerHTML=VIEWS[S.page]();
  (AFTER[S.page]||(()=>{}))();
  if(keepScroll) window.scrollTo(0,y); else window.scrollTo(0,0);
}
function go(p){ S.page=p; document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); render(); }

/* ============================== VIEWS ============================== */
const VIEWS={}, AFTER={};

/* ---------- OVERVIEW ---------- */
VIEWS.overview=()=>{
  const prev=DATES[DATES.length-2];

function activity(){
  const out=[];
  for(const b of S.imports) out.push({d:'9999',t:`นำเข้า ${b.file}: เพิ่ม ${b.added} แถว`,s:b.undone?'ย้อนกลับแล้ว':'เมื่อสักครู่',i:'up',c:'i-blue'});
  for(const k in store.notes){ if(!store.notes[k]) continue; const [c,d]=k.split('|'); out.push({d,t:(c==='*'?'ทั้งบริษัท':c)+': '+store.notes[k],s:fD(d)+' · บันทึกในเว็บ',i:'note',c:'i-amber'}); }
  for(const c in P){ const n=P[c].notes; for(const d in n){ if(n[d]!=='x'&&d>=addD(ASOF,-90)) out.push({d,t:`${c}: ${n[d]}`,s:fD(d)+' · Master Planning',i:'alert',c:'i-red'}); } }
  return out.sort((a,b)=>b.d.localeCompare(a.d));
}
AFTER.overview=()=>{
  const days=range(addD(ASOF,-(S.chartRange-1)),ASOF);
  const cats=['เอเซีย','เอเซียร่วม','ผู้รับเหมาร่วม'];
  const ser=cats.map(c=>days.map(d=>sum((LBYD[d]||[]).filter(l=>companyCat(l.company)===c),l=>l.qty)));
  mk('cDaily',{type:'bar',data:{labels:days.map(fDs),datasets:cats.map((c,i)=>({label:c,data:ser[i],backgroundColor:css('--s'+(i+1)),borderRadius:3,borderSkipped:'start',borderColor:css('--surface'),borderWidth:{top:1},maxBarThickness:14,stack:'a'}))},
    options:{interaction:{mode:'index',intersect:false},scales:{x:axisX({stacked:true}),y:axisY({stacked:true})},plugins:{tooltip:{callbacks:{label:c=>` ${c.dataset.label}: ${fN(c.raw)} ต้น`,footer:it=>{const d=days[it[0].dataIndex];const t=sum(LBYD[d]||[],l=>l.qty);const n=coNote(d);return `รวม ${fN(t)} ต้น`+(n?`\nหมายเหตุ: ${n}`:'')+(dow(d)===0?'\n(วันอาทิตย์)':'');}}}}}});
  const counts=['ongoing','on_hand','hold','completed','cancelled'].map(s=>byStatus(s).length);
  mk('cStatus',{type:'doughnut',data:{labels:['กำลังตอก','รอเริ่ม','พักงาน','เสร็จแล้ว','ยกเลิก'],datasets:[{data:counts,backgroundColor:[1,2,3,4,5].map(i=>css('--s'+i)),borderColor:css('--surface'),borderWidth:2,hoverOffset:4}]},options:{cutout:'72%',plugins:{tooltip:{callbacks:{label:c=>` ${c.label}: ${fN(c.raw)} โครงการ`}}}}});
  document.querySelectorAll('#rangeSeg button').forEach(b=>b.onclick=()=>{S.chartRange=+b.dataset.r;render(true)});
  document.getElementById('lineBtn').onclick=()=>showText('สรุปส่ง LINE',fD(ASOF),lineDaily(ASOF));
};

VIEWS.plan=()=>{
  const tabs=['ongoing','on_hand','hold','completed','cancelled','all'];
  const q=S.q.trim().toLowerCase();
  let rows=Object.values(P).filter(p=>(S.planTab==='all'||p.status===S.planTab));
  if(q) rows=Object.values(P).filter(p=>(p.code+' '+p.name+' '+p.customer+' '+p.pm+' '+p.sales).toLowerCase().includes(q));
  rows.sort((a,b)=> a.status==='ongoing'&&b.status==='ongoing'? prog(a.code).ab-prog(b.code).ab : (b.start||'').localeCompare(a.start||''));
  const shown=rows.slice(0,150);
  return hello('แผน / ผลงานรายโครงการ','คลิกที่โครงการเพื่อขยายดูรายวัน — ตอกด้วยปั้นจั่นไหน ขนาดอะไร ยาวเท่าไร กะไหน'+(canEdit()?' · คลิกตัวเลขหรือหมายเหตุเพื่อแก้ไข':''))+`
  ${canEdit()?`<div class="banner">${svg('note','width="18" height="18"')}<div><b>แก้ไขได้ทุกช่องที่มีเส้นประเมื่อชี้</b> — แผน, ผลงาน, หมายเหตุรายวัน (เช่น น้ำท่วม, ฝนตก, รอพื้นที่) และข้อมูลโครงการ · ในพรีวิวนี้ค่าที่แก้จะเก็บในเบราว์เซอร์นี้เท่านั้น</div></div>`:''}
  <div class="card">
    <div class="toolbar"><div class="seg" id="tabs">${tabs.map(t=>`<button data-t="${t}" class="${S.planTab===t&&!q?'on':''}">${t==='all'?'ทั้งหมด':ST_LABEL[t]}<span class="n">${t==='all'?Object.keys(P).length:byStatus(t).length}</span></button>`).join('')}</div><div class="grow"></div>

      <button class="btn ghost sm" id="expAll">${svg('dl')}Export Master Planning</button>${canEdit()?`<button class="btn sm" id="coNoteBtn">${svg('note')}หมายเหตุทั้งบริษัท</button>`:''}</div>
    ${q?`<div class="sub" style="margin-bottom:8px">ผลการค้นหา "${esc(S.q)}" ${rows.length} โครงการ <button class="link" id="clearQ">ล้าง</button></div>`:''}
    <div class="tbl-wrap"><table><thead><tr><th></th><th>รหัส</th><th>โครงการ / ลูกค้า</th><th>สถานะ</th><th>PM</th><th class="num">สั่งซื้อ</th><th class="num">ตอกแล้ว</th><th>ความคืบหน้า</th><th>เทียบแผน</th><th class="num">อัตรา/วัน</th><th>คาดเสร็จ</th><th>กำหนดเสร็จ</th></tr></thead>
    <tbody>${shown.map(p=>planRow(p.code)).join('')||'<tr><td colspan="12" class="empty">ไม่พบโครงการ</td></tr>'}</tbody></table></div>

function planRow(c){
  const p=P[c], g=prog(c), open=S.expanded.has(c);
  const late = g.eta && p.end && g.eta>p.end;
  return `<tr class="prow ${open?'open':''}" data-toggle="${c}"><td><span class="caret">▸</span></td><td class="code">${c}</td><td><b style="font-weight:500">${esc(p.name)}</b><span class="cell-sub">${esc(p.customer)}</span></td><td>${stBadge(p.status)}</td><td class="nowrap">${esc(p.pm)||'–'}</td><td class="num">${fN(g.order)}</td><td class="num">${fN(g.done,1)}</td><td>${progBar(c)}</td><td>${dChip(c)}</td><td class="num">${g.rate?fN(g.rate,1):'–'}</td><td class="nowrap ${late?'wk':''}">${g.eta?fD(g.eta):'–'}</td><td class="nowrap">${fD(p.end)}</td></tr>
  ${open?`<tr class="detail"><td colspan="12">${projDetail(c)}</td></tr>`:''}`;
}

      ${fieldEd(c,'order','ยอดสั่งซื้อ (ต้น)',p.order,fN(p.order))}${S.role!=='production'?fieldEd(c,'vpp','มูลค่าเฉลี่ย/ต้น',p.vpp,fB2(p.vpp)):''}${fieldEd(c,'billing','รอบส่งมอบ / วางบิล',p.billing)}

function drawSCurves(){

function lineDaily(d){
  const ls=LBYD[d]||[]; const by={}; for(const l of ls) by[l.p]=(by[l.p]||0)+l.qty;
  const lines=[`📋 สรุปผลงานตอก ${TH_D[dow(d)]} ${fD(d)}`,`รวม ${fN(sum(ls,l=>l.qty))} ต้น | ${Object.keys(by).length} โครงการ | ${new Set(ls.map(l=>l.rig)).size} ปั้นจั่น`,''];
  for(const c of Object.keys(by).sort((a,b)=>by[b]-by[a])){ const pv=planMap(c)[d]||0; lines.push(`• ${c} ${P[c]?.name||''}: ${fN(by[c])} ต้น${pv?` (แผน ${fN(pv,1)})`:''}`); }
  const miss=Object.keys(P).filter(c=>(planMap(c)[d]||0)>0&&!by[c]);
  if(miss.length){ lines.push('','⚠️ มีแผนแต่ไม่ได้ตอก:'); for(const c of miss) lines.push(`• ${c}${noteOf(c,d)?' — '+noteOf(c,d):''}`); }
  if(coNote(d)) lines.push('',`หมายเหตุ: ${coNote(d)}`);
  const behind=Object.values(P).filter(p=>p.status==='ongoing'&&prog(p.code).ab<=-0.5).length; lines.push('',`โครงการช้ากว่าแผน ${behind} โครงการ`);
  return lines.join('\n');
}

function parseDateCell(v){
  if(v==null||v==='') return '';
  if(typeof v==='number') return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  if(v instanceof Date) return v.toISOString().slice(0,10);
  const s=String(v).trim(); let m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
  if(m){ let y=+m[3]; if(y<100) y+= y>40?2500:2000; if(y>2400) y-=543; return `${y}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`; }
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m){ let y=+m[1]; if(y>2400) y-=543; return `${y}-${m[2]}-${m[3]}`; }
  return '';
}

    const idx={}; found.h.forEach((h,i)=>{ const k=HMAP[h]; if(k&&!(k in idx)) idx[k]=i; });
    const need=['d','p','rig','qty'].filter(k=>!(k in idx)); if(need.length){ st.innerHTML=`<div class="banner" style="background:var(--bad-soft)">ขาดคอลัมน์จำเป็น: ${need.join(', ')}</div>`; return; }
    const exist={}; for(const l of LOGS){ const k=baseKey(l); exist[k]=(exist[k]||0)+1; }
    const seen={}; const rows=[];
    for(const r of found.aoa.slice(found.hi+1)){
      if(r.every(x=>x===''||x==null)) continue;
      const g=k=>k in idx? r[idx[k]] : '';
      const num=k=>{const v=g(k); return typeof v==='number'?v: +String(v).replace(/,/g,'')||0};
      const l={d:parseDateCell(g('d')),p:String(g('p')).trim(),owner:String(g('owner')).trim(),agency:String(g('agency')).trim(),province:String(g('province')).trim(),ptype:String(g('ptype')).trim(),jst:String(g('jst')).trim(),leader:String(g('leader')).trim(),company:String(g('company')).trim(),rig:String(g('rig')).trim(),rigtype:String(g('rigtype')).trim(),order:num('order'),std:String(g('std')).trim(),size:String(g('size')).trim(),section:num('section'),len:num('len'),shift:String(g('shift')).trim(),qty:num('qty'),cubic:num('cubic'),m:num('m'),src:'import'};
      if(!l.d&&!l.p) continue; // แถวผลรวม/แถวว่าง
      let st2='new', why='', warn='';
      if(!l.d) {st2='err';why='วันที่อ่านไม่ได้';} else if(!l.p){st2='err';why='ไม่มีรหัสโครงการ';} else if(!(l.qty>0)){st2='err';why='จำนวนต้นไม่ถูกต้อง';}
      if(st2==='new'){ const k=baseKey(l); seen[k]=(seen[k]||0)+1; if(seen[k]<=(exist[k]||0)) st2='dup'; else { if(!P[l.p]) warn='โครงการใหม่ (จะสร้างให้อัตโนมัติ)'; else if(l.d>addD(ASOF,3)) warn='วันที่ล่วงหน้า'; } }
      rows.push({l,st:st2,why,warn});
    }
    S.pending={file:f.name,sheet:found.name,rows}; render(true);
  }catch(err){ st.innerHTML=`<div class="banner" style="background:var(--bad-soft)">อ่านไฟล์ไม่ได้: ${esc(err.message)}</div>`; } };
  rd.readAsArrayBuffer(f);
}

/* ============================== EXPORT MASTER PLANNING ============================== */
function exportMasterPlanning(){
  const codes=Object.values(P).filter(p=>p.status!=='completed'&&p.status!=='cancelled').map(p=>p.code);
  const ks=new Set(); codes.forEach(c=>{Object.keys(planMap(c)).forEach(d=>ks.add(d));Object.keys(actualMap(c)).forEach(d=>ks.add(d));});
  const ds=[...ks].sort(); const days=ds.length?range(ds[0],ds[ds.length-1]):[];
  const H=['รหัสโครงการ','PM รับผิดชอบ','Sales รับผิดชอบ','สถานะ','ชื่อลูกค้า','โครงการ','สั่งซื้อ','มูลค่าโครงการ','มูลค่าเฉลี่ย/ต้น','ตอกแล้ว','คงเหลือตอก','Remaining','คิดเลขรวม','Ahead or behind schedule','กำหนดเริ่มงาน','กำหนดแล้วเสร็จ','วันที่',...days.map(fD)];
  const stx={ongoing:'1-Ongoing',on_hand:'2-On Hand',hold:'3-Hold',completed:'5-Completed',cancelled:'6-ยกเลิก'};
  const aoa=[H];
  for(const c of codes){ const p=P[c],g=prog(c),pl=planMap(c),a=actualMap(c);
    aoa.push([c,p.pm,p.sales,stx[p.status],p.customer,p.name,g.order,p.value,p.vpp,+g.done.toFixed(3),+g.remain.toFixed(3),g.order?+(g.remain/g.order).toFixed(4):0,g.order,+g.ab.toFixed(3),p.start,p.end,'Plan',...days.map(d=>pl[d]||'')]);
    aoa.push([c,'','',stx[p.status],p.billing,'','','','','','','','',g.ab>=0?'Ahead':'Behind',p.start,p.endNote||'','Actual',...days.map(d=>a[d]||(noteOf(c,d)||''))]); }
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),'Pile');
  const dd=ASOF.split('-'); XLSX.writeFile(wb,`Master Planning Update ${dd[2]}-${dd[1]}-${String(+dd[0]+543).slice(2)}.xlsx`);
  toast('Export Master Planning แล้ว');
}

  let cur='';
  if(kind==='plan') cur=planMap(c)[d]||''; else if(kind==='act') cur=actualMap(c)[d]||''; else if(kind==='note') cur= c==='*'?coNote(d):noteOf(c,d); else if(kind==='N') cur=store.N; else cur=P[c][f]??'';
  if(kind==='note'&&String(cur).startsWith('ไม่มีการตอก (x)')) cur='ไม่มีการตอก';
  let html;
  if(kind==='field'&&f==='status') html=`<select>${Object.entries(ST_LABEL).map(([k,v])=>`<option value="${k}" ${k===cur?'selected':''}>${v}</option>`).join('')}</select>`;
  else if(kind==='field'&&(f==='start'||f==='end')) html=`<input type="date" value="${esc(cur)}">`;
  else if(kind==='note') html=`<input value="${esc(cur)}" placeholder="เช่น น้ำท่วม, ฝนตก"><div class="quick">${['ฝนตก','น้ำท่วม','รอพื้นที่','เครื่องเสีย','วันหยุด','รอใบอนุญาต','ลูกค้าสั่งหยุด'].map(q=>`<button type="button" data-q="${q}">${q}</button>`).join('')}</div>`;
  else html=`<input ${['plan','act','N'].includes(kind)||['order','vpp'].includes(f)?'type="number" step="any" style="width:90px"':''} value="${esc(cur)}">`;
  el.innerHTML=html; const inp=el.querySelector('input,select'); inp.focus(); if(inp.select) inp.select();
  let done=false;
  const commit=(cancel)=>{ if(done) return; done=true; if(cancel){ render(true); return; }
    let v=inp.value;
    if(kind==='plan'||kind==='act'){ const m=store.edits[kind]; (m[c]||(m[c]={}))[d]= v===''?0:+v; toast(`บันทึก${kind==='plan'?'แผน':'ผลงาน'} ${c} ${fD(d)} = ${v||0}`); }
    else if(kind==='note'){ store.notes[c+'|'+d]=v.trim(); toast(v.trim()?'บันทึกหมายเหตุแล้ว':'ลบหมายเหตุแล้ว'); }
    else if(kind==='N'){ store.N=Math.max(1,+v||4); toast(`ตั้งเกณฑ์เตือน ${store.N} สัปดาห์`); }
    else { if(['order','vpp'].includes(f)) v=+v||0; (store.proj[c]||(store.proj[c]={}))[f]=v; P[c][f]=v; toast('บันทึกข้อมูลโครงการแล้ว'); }
    save(); memo={}; render(true); };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape') commit(true); });
  inp.addEventListener('blur',()=>setTimeout(()=>{ if(!el.contains(document.activeElement)) commit(); },120));
  if(inp.tagName==='SELECT') inp.addEventListener('change',()=>commit());
  el.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('mousedown',e=>{e.preventDefault(); inp.value=b.dataset.q; commit();}));
}

/* ============================== EVENTS ============================== */
function showText(title,sub,text){ document.getElementById('mTitle').textContent=title; document.getElementById('mSub').textContent=sub; document.getElementById('mText').value=text; document.getElementById('modalBg').classList.add('show'); }
document.getElementById('mClose').onclick=()=>document.getElementById('modalBg').classList.remove('show');
document.getElementById('modalBg').onclick=e=>{ if(e.target.id==='modalBg') e.currentTarget.classList.remove('show'); };
document.getElementById('mCopy').onclick=()=>{ const t=document.getElementById('mText'); t.select(); (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('คัดลอกแล้ว'),()=>{document.execCommand('copy');toast('คัดลอกแล้ว')}); };
document.addEventListener('click',e=>{
  const ed=e.target.closest('[data-edit]'); if(ed){ if(canEdit()) { e.stopPropagation(); openEditor(ed); } return; }
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const o=e.target.closest('[data-open]'); if(o){ e.preventDefault(); const c=o.dataset.open; S.expanded.add(c); S.q=c; S.page='plan'; render(); return; }
  const t=e.target.closest('[data-toggle]'); if(t){ const c=t.dataset.toggle; S.expanded.has(c)?S.expanded.delete(c):S.expanded.add(c); render(true); return; }
  const f=e.target.closest('[data-full]'); if(f){ const c=f.dataset.full; S.fullDays.has(c)?S.fullDays.delete(c):S.fullDays.add(c); render(true); return; }
  const u=e.target.closest('[data-undo]'); if(u){ const b=S.imports.find(x=>x.id===u.dataset.undo); LOGS=LOGS.filter(l=>l.batch!==b.id); b.undone=true; reindex(); toast(`ย้อนกลับ ${b.file} แล้ว`); render(true); }
});
document.getElementById('role').onchange=e=>{ S.role=e.target.value; try{localStorage.setItem('mp-role',S.role)}catch(_){} S.page=ROLES[S.role].home; S.expanded.clear(); render(); toast('สลับเป็นมุมมอง '+ROLES[S.role].label); };
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter'){ S.q=e.target.value; S.page=ROLES[S.role].pages.includes('plan')?'plan':S.page; render(); } });
document.getElementById('bell').onclick=()=>{ if(ROLES[S.role].pages.includes('plan')){ S.planTab='ongoing'; S.q=''; go('plan'); } };
document.getElementById('burger').onclick=()=>{ document.getElementById('side').classList.add('open'); document.getElementById('scrim').classList.add('show'); };
document.getElementById('scrim').onclick=()=>{ document.getElementById('side').classList.remove('open'); document.getElementById('scrim').classList.remove('show'); };
document.getElementById('themeBtn').onclick=()=>{ const r=document.documentElement; const dark=r.dataset.theme? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme=dark?'light':'dark'; try{localStorage.setItem('mp-theme',r.dataset.theme)}catch(_){} render(true); };
try{ const t=localStorage.getItem('mp-theme'); if(t) document.documentElement.dataset.theme=t; }catch(_){}
// ลิงก์ตรง: #หน้า/รหัสโครงการ/บทบาท เช่น #plan/A69-A208/planning
(()=>{ const [pg,code,role]=decodeURIComponent(location.hash.slice(1)).split('/'); if(role&&ROLES[role]) S.role=role; if(pg&&PAGES[pg]&&ROLES[S.role].pages.includes(pg)) S.page=pg; if(code&&P[code]){ S.page='plan'; S.q=code; S.expanded.add(code); } })();
render();
</script>
